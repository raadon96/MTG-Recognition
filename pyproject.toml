[project]
name = "mtg-recognition"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "raadon96", email = "adnen.boumessouer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.4.0.post0",
    "imagehash>=4.3.2",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "sqlmodel>=0.0.31",
    "tqdm>=4.67.1",
    "ftfy>=6.3.1",
    "regex>=2026.2.28",
    "clip==1.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "ultralytics>=8.4.1",
    "opencv-contrib-python==4.10.0.84",
    "paddlepaddle==3.2.0",
    "onnxruntime>=1.23.2",
    "paddleocr>=3.3.3",
    "rapidfuzz>=3.14.3",
    "rich>=14.3.2",
    "streamlit>=1.54.0",
    "python-dotenv>=1.2.1",
    "openpyxl>=3.1.5",
    "click>=8.3.1",
    "rembg[cli,cpu]>=2.0.73",
    "httpx>=0.28.1",
    "numpy>=2.0",
]

[project.scripts]
mtg = "mtg_recognition.cli:cli"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    # "ipython>=9.8.0",
    "sqlacodegen>=3.2.0",
    "rapidocr>=3.7.0",
    "cv2-enumerate-cameras>=1.3.3",
    "pyarrow>=22.0.0",
    "ipyplot>=1.1.2",
    "dvc[gdrive]>=3.67.1",
    "ty>=0.0.89",
    "ruff>=0.17.1",
    "pytest>=9.1.1",
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
paddlepaddle = { index = "paddle" }
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]
clip = { git = "https://github.com/openai/CLIP" }

[[tool.uv.index]]
# Optional name for the index.
name = "paddle"
# Required URL for the index.
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
# Prevent other packages from being installed from this index unless explicitly pinned to it.
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "mtg_recognition"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires models, reference data or the DVC dataset; deselect with -m 'not slow'",
    "unit: fast unit tests with no external dependencies",
]

[tool.importlinter]
root_package = "mtg_recognition"
include_external_packages = true

# A layer may import the layers below it, never one above; `|` siblings can't
# import each other. `jobs` imports `engine.matching.phash` on purpose: index and
# query hashes must come from the same code.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "mtg_recognition.cli",
    "mtg_recognition.app | mtg_recognition.jobs | mtg_recognition.benchmark",
    "mtg_recognition.engine",
    "mtg_recognition.reference",
    "mtg_recognition.settings",
]

[[tool.importlinter.contracts]]
name = "Engine stages are independent"
type = "independence"
modules = [
    "mtg_recognition.engine.matching",
    "mtg_recognition.engine.ocr",
    "mtg_recognition.engine.segmentation",
]

# The engine, jobs, the benchmark and the app are plain functions any client can
# call; Click stays in `cli`.
[[tool.importlinter.contracts]]
name = "Only the CLI imports Click"
type = "forbidden"
source_modules = [
    "mtg_recognition.app", "mtg_recognition.jobs", "mtg_recognition.benchmark",
    "mtg_recognition.engine", "mtg_recognition.reference", "mtg_recognition.settings",
]
forbidden_modules = ["click"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.py" = ["E501", "B905", "F401", "I001"]
"*.ipynb" = ["E501", "B905", "F401", "I001"]

[tool.ruff.format]
preview = false

[tool.marimo.formatting]
line_length = 88 # keep consistent with ruff's line-length

[tool.marimo.save]
format_on_save = true


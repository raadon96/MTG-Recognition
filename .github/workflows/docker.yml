name: docker

# On a pull request: builds the image and checks that it serves the web app and
# recognises a card. On a release: does the same on each platform, then
# publishes the image to ghcr.io/raadon96/mtg-recognition.
on:
  # Runs only on changes to what the image is built from: an allowlist, unlike
  # the engine workflow, because the Dockerfile copies named paths, and a build
  # takes several minutes. A path the Dockerfile starts copying belongs here
  # too, except README.md, LICENSE and THIRD_PARTY_NOTICES.md: left out on
  # purpose, so a docs-only PR doesn't build the image.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      # The dependencies installed into the image's venv.
      - pyproject.toml
      - uv.lock
      # Copied into the image.
      - "src/**"
      - "models/**"
      - data/reference/catalog.sqlite
      # Streamlit's configuration, copied into the image.
      - ".streamlit/**"
      # This workflow, and the build and checks it runs.
      - .github/workflows/docker.yml
      - ".github/actions/docker-image/**"
      # The query image the check recognises.
      - "tests/regression/matching/fixtures/**"

  # /ship pushes the release's tag on main's merge commit.
  push:
    tags: ["v*"]

  # Reruns a failed publish, since a pushed tag can't be moved: run it from the
  # tag, with the same tag as input. Also tests the publish before a release:
  # run it from a branch, with a version such as v0.0.0-test and a scratch
  # image. Never push a v* tag for a test: it can't be deleted.
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.6.0. Its version, without the v, becomes the image's tag.
        required: true
      image:
        description: The image to publish. Anything other than ghcr.io/raadon96/mtg-recognition can run from a branch.
        default: ghcr.io/raadon96/mtg-recognition

permissions: {}

env:
  IMAGE: ${{ inputs.image || 'ghcr.io/raadon96/mtg-recognition' }}
  TAG: ${{ inputs.tag || github.ref_name }}

# A new PR commit cancels the run on the previous one, as in the checks
# workflow. A publish is never cancelled: half a publish leaves pushed digests
# without a manifest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # packages: write is for the registry cache only; nothing pushes the image
    # itself from a pull request.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A PR from a fork gets a read-only token, so it reads the cache without
      # logging in and doesn't write it.
      - if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/docker-image
        with:
          platform: linux/amd64
          write-cache: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  # The release's tags and labels, shared by the per-platform images and the
  # manifest.
  metadata:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # Without a semver tag, the metadata would hold only latest, and the run
      # would publish latest with no version.
      - name: Check the tag and the ref it runs from
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag '$TAG' isn't a version such as v0.6.0."
            exit 1
          fi
          if [[ $IMAGE == ghcr.io/raadon96/mtg-recognition && ( $REF_TYPE != tag || $REF_NAME != "$TAG" ) ]]; then
            echo "::error::Publishing to $IMAGE runs from the tag $TAG itself, not from '$REF_NAME'."
            exit 1
          fi
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}

      # Tags: X.Y.Z and latest, with no X.Y and no dev. The labels go on each
      # platform's image; the annotations, at the index level, go on the
      # manifest, where GHCR reads them.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=MTG Recognition
            org.opencontainers.image.description=Recognises Magic: The Gathering cards in a photo and finds each card's printing.
            org.opencontainers.image.source=https://github.com/raadon96/MTG-Recognition
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.title=MTG Recognition
            org.opencontainers.image.description=Recognises Magic: The Gathering cards in a photo and finds each card's printing.
            org.opencontainers.image.source=https://github.com/raadon96/MTG-Recognition
            org.opencontainers.image.licenses=AGPL-3.0-only

  # Each platform is built and checked natively, as on pull requests. Nothing
  # is pushed until both platforms pass.
  check:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # packages: write is for the registry cache.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/docker-image
        with:
          platform: ${{ matrix.platform }}
          write-cache: "true"

  # Builds each platform again, from the cache the check just wrote, so its
  # layers are the ones checked, and pushes it by digest, with no tag. The
  # labels change only the image's config.
  push:
    needs: [metadata, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # The provenance comes from the attestation on the manifest instead of
      # buildx's own, which GHCR lists as an extra unknown/unknown platform.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.metadata.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/raadon96/mtg-recognition-cache:${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Write the digest to a file
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the platforms' digests as one multi-platform manifest, and attests its
  # build provenance.
  manifest:
    needs: [metadata, push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: create
        name: Create the manifest
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<<"$METADATA")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '.annotations[]' <<<"$METADATA")
          for file in "$RUNNER_TEMP"/digests/*; do args+=("$IMAGE@sha256:$(basename "$file")"); done
          docker buildx imagetools create "${args[@]}"

          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            docker buildx imagetools inspect "$IMAGE:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          METADATA: ${{ needs.metadata.outputs.json }}
          VERSION: ${{ needs.metadata.outputs.version }}

      # The repository is owned by a user, and storage records are only for
      # organizations' repositories.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.create.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

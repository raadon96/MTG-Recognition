# Fast checks on every commit. Hooks are local and run through uv, so tool
# versions come from uv.lock. Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: no-commit-to-branch
        name: no commit to main
        entry: uv run no-commit-to-branch --branch main
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: lint-imports
        name: lint-imports
        entry: uv run lint-imports
        language: system
        files: \.py$|^pyproject\.toml$|^uv\.lock$
        pass_filenames: false
      - id: pytest
        name: pytest (not slow)
        entry: uv run pytest -m "not slow" -q
        language: system
        files: \.py$|^pyproject\.toml$|^uv\.lock$
        pass_filenames: false

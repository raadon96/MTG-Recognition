name: release-branch

# Releases go from dev to main. The main ruleset requires this check, since
# rulesets can't restrict which branch a PR comes from.
on:
  # edited reruns the check when an open PR's base is changed to main.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions: {}

jobs:
  release-branch:
    runs-on: ubuntu-latest
    steps:
      # The head branch name comes from the PR author, so it goes through an
      # environment variable rather than into the script.
      - run: |
          if [ "$HEAD_REF" != dev ]; then
            echo "::error::PRs into main must come from dev, not '$HEAD_REF'."
            exit 1
          fi
        env:
          HEAD_REF: ${{ github.head_ref }}

name: checks

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

# A run on a superseded PR commit only spends runner minutes, but every commit
# on dev and main needs its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major-version tag, only full versions.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv reads the Python version from .python-version.
      - run: uv sync --locked --dev

      # no-commit-to-branch stops local commits to main; on a push to main it
      # would fail every run.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

name: engine

# Runs the slow tests and the benchmark, so recognition regressions fail before
# merge. Skipped on changes that can't affect them: a denylist, because an
# allowlist would go stale silently as code moves.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "GLOSSARY.md"
  # A PR's own caches are visible only to that PR; it can also restore the
  # caches of its base branch and of main, the default branch. So a push to dev
  # or main that changes the dataset, such as a merged PR or a release, starts
  # a run on that branch, which saves the new dataset cache for the PRs into it.
  push:
    branches: [dev, main]
    paths:
      - data/benchmark.dvc
  # Scheduled runs use main, on Mondays and Thursdays at 04:17 UTC. GitHub
  # deletes a cache no run has restored for 7 days; two runs a week restore
  # main's dataset cache in time even when GitHub starts them late, and check
  # main against changes from outside the repo, such as a new runner image or
  # expired Drive credentials. Minute 17 avoids the top of the hour, when
  # GitHub delays or drops scheduled runs most.
  schedule:
    - cron: "17 4 * * 1,4"
  # Actions → engine → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

# Same settings as the checks workflow: a new PR commit cancels the run on the
# previous one; push, scheduled and manual runs never cancel a run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --dev

      # Caches are restored and saved in separate steps: actions/cache saves only
      # when the whole job passes, so a failing run would download again on every
      # rerun.

      # The only cache this workflow saves itself; setup-uv's package cache is
      # saved by the checks workflow. The benchmark images change only with
      # their DVC pointer file.
      - id: dataset
        uses: actions/cache/restore@v6
        with:
          path: data/benchmark
          key: benchmark-${{ hashFiles('data/benchmark.dvc') }}

      # The dataset-reader service account key, read-only (ADR 0001).
      - if: steps.dataset.outputs.cache-hit != 'true'
        run: |
          uv run dvc remote modify --local origin gdrive_use_service_account true
          uv run dvc pull data/benchmark.dvc
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

      - if: steps.dataset.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/benchmark
          key: ${{ steps.dataset.outputs.cache-primary-key }}

      - run: uv run pytest -m slow

      # Runs even when a slow test fails, so one run reports both.
      - if: ${{ !cancelled() }}
        run: uv run mtg benchmark run

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-latest
          path: output/benchmark/latest.json
